name: Deploy install assets to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - bin/hat
      - website/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage public site and install assets
        run: |
          cp -R website/. public
          mkdir -p public/bin
          cp install.sh public/install.sh
          cp bin/hat public/bin/hat
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
